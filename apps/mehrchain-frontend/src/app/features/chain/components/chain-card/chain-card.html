<div class="chain-card p-4 bg-card rounded-2xl border border-border/80 shadow-xs">
  <div class="flex items-start justify-between gap-2">
    <div class="flex items-start gap-3 min-w-0">
      <div
        class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center text-primary font-semibold shrink-0"
        aria-hidden="true"
      >
        {{ partnerAvatarInitial() }}
      </div>
      <div class="min-w-0">
        <p class="font-semibold text-foreground text-sm break-words">
          &#64;{{ partnerUsername() }}
        </p>
        <p class="text-sm text-foreground break-words">{{ partnerHabitTitle() }}</p>
        <p class="mt-1 text-xs text-muted-foreground">{{ stateLabel() }}</p>
      </div>
    </div>
    <div class="flex items-center shrink-0" [attr.aria-busy]="pending()">
      <button
        type="button"
        (click)="sendHeart()"
        [disabled]="pending() || stale() || isHeartSent()"
        class="min-h-11 min-w-11 rounded-xl text-muted-foreground hover:bg-muted/60 disabled:cursor-default focus-visible:outline-2 focus-visible:outline-primary"
        [attr.aria-label]="
          pending()
            ? 'Saving heart'
            : isHeartSent()
              ? 'Heart sent for this habit today'
              : 'Send heart to ' + partnerHabitTitle()
        "
        [attr.aria-describedby]="errorMessage() ? 'chain-error-' + connection().id : null"
        [title]="isHeartSent() ? 'Heart sent today' : 'Send heart'"
      >
        <lucide-icon
          name="heart"
          class="w-5 h-5 mx-auto"
          [class.text-rose-500]="isHeartSent()"
          [class.fill-rose-500]="isHeartSent()"
          aria-hidden="true"
        ></lucide-icon>
      </button>
      <button
        #optionsToggle
        type="button"
        (click)="toggleMenu()"
        class="min-h-11 min-w-11 rounded-xl text-muted-foreground hover:bg-muted/60 focus-visible:outline-2 focus-visible:outline-primary"
        aria-label="Chain details and options"
        [attr.aria-expanded]="isMenuOpen()"
        [attr.aria-controls]="'chain-details-' + connection().id"
      >
        <lucide-icon name="more-vertical" class="w-4 h-4 mx-auto" aria-hidden="true"></lucide-icon>
      </button>
    </div>
  </div>
  @if (errorMessage()) {
    <p
      [id]="'chain-error-' + connection().id"
      role="alert"
      class="mt-2 text-xs text-rose-600 dark:text-rose-400"
    >
      {{ errorMessage() }}
    </p>
  }
  @if (isMenuOpen()) {
    <div
      [id]="'chain-details-' + connection().id"
      (keydown.escape)="closeMenu(); optionsToggle.focus()"
      class="mt-3 pt-3 border-t border-border/50 text-xs text-muted-foreground"
    >
      <p class="break-words">
        Your linked habit: <span class="text-foreground">{{ myHabitTitle() }}</span>
      </p>
      <p class="mt-1">One heart per habit each recipient day.</p>
      <button
        type="button"
        (click)="handleDisconnect(); optionsToggle.focus()"
        [disabled]="pending()"
        class="mt-2 min-h-11 px-3 rounded-xl text-destructive hover:bg-muted/60 disabled:opacity-50"
      >
        Disconnect Chain
      </button>
    </div>
  }
</div>
