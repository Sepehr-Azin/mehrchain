<div class="app-overlay">
  <!-- Backdrop -->
  <div
    class="absolute inset-0 bg-black/60 backdrop-blur-sm"
    (click)="!isSubmitting() && close.emit()"
  ></div>

  <!-- Modal Dialog -->
  <div
    appDialog
    aria-label="Edit habit"
    (dialogDismiss)="!isSubmitting() && close.emit()"
    class="app-dialog bg-card rounded-3xl p-6 shadow-2xl z-10 border border-border/50"
  >
    @if (errorMessage()) {
      <p role="alert" class="text-red-500 mb-3">{{ errorMessage() }}</p>
    }
    <div class="flex flex-wrap justify-between items-center gap-3 mb-5">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-primary/10 flex items-center justify-center text-primary">
          <lucide-icon name="edit" class="w-5 h-5"></lucide-icon>
        </div>
        <div>
          <h2 class="text-xl font-bold text-foreground">Edit Habit</h2>
          <p class="text-xs text-muted-foreground">Adjust your commitment & reminders</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button
          type="button"
          (click)="isPublic.set(!isPublic())"
          [disabled]="isSubmitting()"
          [attr.aria-label]="isPublic() ? 'Make habit private' : 'Make habit public'"
          [attr.aria-pressed]="isPublic()"
          class="w-8 h-8 rounded-full flex items-center justify-center transition-all border"
          [class]="
            isPublic()
              ? 'bg-teal-500/15 text-teal-600 dark:text-teal-400 border-teal-500/30'
              : 'bg-muted/60 text-muted-foreground border-border'
          "
          [title]="isPublic() ? 'Public Habit (Can be chained)' : 'Private Habit'"
        >
          <lucide-icon [name]="isPublic() ? 'globe' : 'lock'" class="w-4 h-4"></lucide-icon>
        </button>
        <button
          type="button"
          (click)="!isSubmitting() && close.emit()"
          [disabled]="isSubmitting()"
          aria-label="Close dialog"
          class="w-8 h-8 rounded-full bg-muted/60 hover:bg-muted text-muted-foreground flex items-center justify-center transition-colors"
        >
          <lucide-icon name="x" class="w-4 h-4"></lucide-icon>
        </button>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()">
      <fieldset [disabled]="isSubmitting()" class="min-w-0 space-y-4">
        <!-- Habit Title -->
        <div>
          <label
            class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1.5"
          >
            Habit Name
          </label>
          <input
            type="text"
            [ngModel]="title()"
            (ngModelChange)="title.set($event)"
            name="title"
            aria-label="Habit name"
            required
            class="w-full bg-muted/40 border border-border rounded-2xl px-4 py-3 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all"
          />
        </div>

        <!-- Why (Personal Motivation) -->
        <div>
          <label
            class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1.5 flex items-center gap-1.5"
          >
            <span>Why (optional)</span>
          </label>
          <textarea
            [ngModel]="why()"
            (ngModelChange)="why.set($event)"
            name="why"
            aria-label="Why this matters to you"
            rows="2"
            placeholder="Why does this habit matter to you?"
            class="w-full bg-muted/40 border border-border rounded-2xl px-4 py-2.5 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all resize-none"
          ></textarea>
        </div>

        <!-- Target Duration -->
        <div>
          <label
            class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1.5"
          >
            Completed-day target
          </label>
          <div class="grid grid-cols-2 gap-2.5">
            <!-- Endless Journey Option -->
            <button
              type="button"
              (click)="setEndlessDuration()"
              class="py-2.5 px-3 rounded-2xl border-2 transition-all flex items-center justify-center gap-2 text-xs font-bold"
              [class]="
                duration() === -1 && !isCustomDuration()
                  ? 'border-primary bg-primary/10 text-primary shadow-sm ring-1 ring-primary/30'
                  : 'border-border text-muted-foreground hover:border-primary/30 hover:bg-muted/50'
              "
            >
              <lucide-icon name="sparkles" class="w-4 h-4 text-primary"></lucide-icon>
              <span>Endless Journey</span>
            </button>

            <!-- Custom Duration Option -->
            @if (isCustomDuration()) {
              <div
                class="flex items-center px-3 py-1.5 rounded-2xl border-2 transition-all"
                [class]="
                  !isDurationValid()
                    ? 'border-red-500 bg-red-500/10 ring-2 ring-red-500/20 text-red-500'
                    : 'border-primary bg-card text-primary'
                "
              >
                <input
                  #durInput
                  aria-label="Custom day target"
                  type="text"
                  inputmode="numeric"
                  pattern="[1-9][0-9]*"
                  [value]="customDurationText()"
                  (keydown)="onCustomDurationKeydown($event)"
                  (input)="onCustomDurationInput(durInput.value)"
                  class="w-full text-center font-bold text-xs outline-none bg-transparent h-full transition-colors"
                  [class]="
                    !isDurationValid() ? 'text-red-500 placeholder:text-red-400/50' : 'text-primary'
                  "
                  placeholder="e.g. 21"
                  autoFocus
                />
              </div>
            } @else {
              <button
                type="button"
                (click)="toggleCustomDuration()"
                class="py-2.5 px-3 rounded-2xl border-2 transition-all flex items-center justify-center gap-1.5 text-xs font-bold"
                [class]="
                  duration() > 0 && isCustomDuration()
                    ? 'border-primary bg-primary/10 text-primary shadow-sm'
                    : 'border-border text-muted-foreground hover:border-primary/30 hover:bg-muted/50'
                "
              >
                <lucide-icon name="calendar" class="w-4 h-4"></lucide-icon>
                <span>Custom Days</span>
              </button>
            }
          </div>

          @if (isCustomDuration() && !isDurationValid()) {
            <p class="text-[11px] text-red-500 mt-1.5 font-medium animate-fade-in text-center">
              {{ durationErrorMessage() }}
            </p>
          }
        </div>

        <!-- Daily Reminder Time -->
        <div>
          <label
            class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1.5 flex items-center gap-1.5"
          >
            <lucide-icon name="bell" class="w-3.5 h-3.5 text-primary"></lucide-icon>
            <span>Daily Reminder Time</span>
          </label>
          <input
            type="time"
            [ngModel]="reminderTime()"
            (ngModelChange)="reminderTime.set($event)"
            name="reminderTime"
            aria-label="Daily reminder time"
            class="w-full bg-muted/40 border border-border rounded-2xl px-4 py-3 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-all"
          />
        </div>

        <!-- Category Selector -->
        <div>
          <label
            class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1.5"
          >
            Category
          </label>
          <div class="grid grid-cols-2 gap-2">
            @for (cat of categories; track cat.id) {
              <button
                type="button"
                (click)="category.set(cat.id)"
                class="p-2.5 rounded-2xl border text-left flex items-center gap-2.5 transition-all text-xs font-semibold"
                [class]="
                  category() === cat.id
                    ? 'border-primary bg-primary/10 text-primary'
                    : 'border-border bg-card text-foreground hover:bg-muted/50'
                "
              >
                <lucide-icon [name]="cat.icon" class="w-4 h-4"></lucide-icon>
                <span>{{ cat.label }}</span>
              </button>
            }
          </div>
        </div>

        <!-- Submit & Cancel -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-3">
          <mc-button
            variant="secondary"
            size="lg"
            [fullWidth]="true"
            type="button"
            [disabled]="isSubmitting()"
            (clicked)="!isSubmitting() && close.emit()"
          >
            Cancel
          </mc-button>

          <mc-button
            variant="primary"
            size="lg"
            [fullWidth]="true"
            type="submit"
            [disabled]="!isValid() || isSubmitting()"
            [loading]="isSubmitting()"
          >
            Save Changes
          </mc-button>
        </div>
      </fieldset>
    </form>
  </div>
</div>
