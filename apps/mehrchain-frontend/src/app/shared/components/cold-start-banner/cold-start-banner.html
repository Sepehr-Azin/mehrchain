@if (coldStartService.isColdStarting()) {
  <div class="app-banner z-50" role="status" aria-live="polite">
    <div
      class="bg-card/95 backdrop-blur-md border border-amber-500/30 dark:border-amber-400/20 rounded-2xl p-4 shadow-float flex items-start gap-3.5 ring-1 ring-amber-500/10"
    >
      <div class="relative shrink-0 flex items-center justify-center">
        <app-mero size="xs" [showGlow]="true" />
      </div>

      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-1.5 mb-1">
          <lucide-icon name="sparkles" class="w-3.5 h-3.5 text-amber-500 shrink-0"></lucide-icon>
          <h4 class="text-xs font-bold text-foreground">Still connecting...</h4>
        </div>
        <p class="text-[11px] text-muted-foreground leading-relaxed">
          This is taking longer than usual. Keep this page open; your input stays here.
        </p>
      </div>

      <button
        type="button"
        (click)="dismiss()"
        class="text-muted-foreground hover:text-foreground p-1 rounded-lg hover:bg-muted/50 transition-colors shrink-0 cursor-pointer"
        title="Dismiss notice"
        aria-label="Dismiss connection notice"
      >
        <lucide-icon name="x" class="w-3.5 h-3.5"></lucide-icon>
      </button>
    </div>
  </div>
}
