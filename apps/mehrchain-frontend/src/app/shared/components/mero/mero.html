<div
  class="relative inline-flex items-center justify-center select-none"
  [ngClass]="sizeClasses()"
  [style.--mero-custom-color]="effectiveColor()"
  role="img"
  [attr.aria-label]="mood() === 'sad' ? 'Mero, feeling sad' : 'Mero, smiling'"
>
  <!-- Warm Belly Glow Light -->
  @if (showGlow()) {
    <div class="mero-belly-glow" [style.background]="effectiveGradient()"></div>
  }

  <div
    class="mero-fallback"
    [class.mero-fallback--hidden]="ready()"
    [class.mero-fallback--sad]="mood() === 'sad'"
    aria-hidden="true"
  >
    <span class="mero-hand mero-hand--left"></span>
    <span class="mero-hand mero-hand--right"></span>
    <span class="mero-body">
      <span class="mero-eye mero-eye--left"></span>
      <span class="mero-eye mero-eye--right"></span>
      <span class="mero-mouth"></span>
      <span class="mero-belly"></span>
    </span>
  </div>
  <canvas
    #canvas
    class="mero-canvas"
    [class.mero-canvas--ready]="ready()"
    aria-hidden="true"
  ></canvas>
</div>
