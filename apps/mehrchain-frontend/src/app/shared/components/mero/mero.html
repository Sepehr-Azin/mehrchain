<div class="relative inline-flex items-center justify-center select-none" [ngClass]="sizeClasses()">
  <!-- Warm Belly Glow Light -->
  @if (showGlow()) {
    <div class="mero-belly-glow" [style.background]="effectiveGradient()"></div>
  }

  <!-- Static mascot and glow; profile navigation belongs to the surrounding link. -->
  <div class="relative w-full h-full flex items-center justify-center">
    <!-- Base 3D Mascot Image -->
    <img
      src="assets/mero.png"
      alt="Mero"
      class="w-full h-full object-contain relative z-10 pointer-events-none select-none drop-shadow-sm"
    />
  </div>
</div>
