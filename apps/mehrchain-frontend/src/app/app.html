<div class="app-shell" [class.has-navigation]="showNavbar()">
  <app-cold-start-banner />
  <router-outlet />
</div>

@if (showNavbar()) {
  <nav
    class="app-navigation bg-card/95 backdrop-blur-md border-t border-border/50 flex justify-around items-center z-40"
    aria-label="Main navigation"
  >
    <a
      routerLink="/dashboard"
      ariaCurrentWhenActive="page"
      routerLinkActive="text-primary bg-primary/10"
      class="flex flex-col items-center gap-1 p-2 rounded-xl text-muted-foreground transition-all"
    >
      <lucide-icon name="home" class="w-6 h-6"></lucide-icon>
      <span class="text-[10px] font-bold">Home</span>
    </a>

    <a
      routerLink="/chain"
      ariaCurrentWhenActive="page"
      routerLinkActive="text-primary bg-primary/10"
      class="flex flex-col items-center gap-1 p-2 rounded-xl text-muted-foreground transition-all relative"
    >
      <div class="relative">
        <lucide-icon name="link-2" class="w-6 h-6"></lucide-icon>
        @if (chainService.hasUnread()) {
          <span
            class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-primary rounded-full ring-2 ring-card animate-pulse"
            aria-label="New activity"
          ></span>
        }
      </div>
      <span class="text-[10px] font-bold">Chain</span>
    </a>

    <a
      routerLink="/journey"
      ariaCurrentWhenActive="page"
      routerLinkActive="text-primary bg-primary/10"
      class="flex flex-col items-center gap-1 p-2 rounded-xl text-muted-foreground transition-all"
    >
      <lucide-icon name="trending-up" class="w-6 h-6"></lucide-icon>
      <span class="text-[10px] font-bold">Journey</span>
    </a>

    <a
      routerLink="/profile"
      ariaCurrentWhenActive="page"
      routerLinkActive="text-primary bg-primary/10"
      class="flex flex-col items-center gap-1 p-2 rounded-xl text-muted-foreground transition-all relative"
    >
      <div class="relative">
        <lucide-icon name="user" class="w-6 h-6"></lucide-icon>
        @if (versionService.hasNewVersion()) {
          <span
            class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-blue-500 rounded-full ring-2 ring-card animate-pulse"
            aria-label="New version available"
          ></span>
        }
      </div>
      <span class="text-[10px] font-bold">Profile</span>
    </a>
  </nav>
}
