services:
  - type: web
    name: mehrchain-api
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev --legacy-peer-deps && NX_DAEMON=false npm run build:backend:release
    startCommand: node dist/mehrchain-backend/main.js
    healthCheckPath: /api/version
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
